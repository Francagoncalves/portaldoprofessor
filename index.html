<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal do Aluno - Turmas e PDFs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  
  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
  }
  
  .container { max-width: 1200px; margin: 0 auto; }
  
  header {
    text-align: center;
    color: white;
    padding: 30px 20px;
    margin-bottom: 30px;
  }
  
  header h1 {
    font-size: 2.5rem;
    margin-bottom: 10px;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
  }
  
  header p { font-size: 1.1rem; opacity: 0.9; }
  
  .turmas-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
  }
  
  .turma-card {
    background: white;
    border-radius: 15px;
    padding: 25px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    position: relative;
    overflow: hidden;
  }
  
  .turma-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.25);
  }
  
  .turma-card.ativa {
    background: linear-gradient(135deg, #ffd89b, #c7e9fb);
    transform: translateY(-8px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.3);
  }
  
  .turma-icon {
    font-size: 3rem;
    margin-bottom: 10px;
  }
  
  .turma-card h3 {
    color: #333;
    font-size: 1.3rem;
    margin-bottom: 8px;
  }
  
  .turma-card .info {
    color: #666;
    font-size: 0.9rem;
  }
  
  .badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #667eea;
    color: white;
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 0.8rem;
    font-weight: bold;
  }
  
  .badge.fixo {
    background: #f39c12;
  }
  
  .painel {
    background: white;
    border-radius: 15px;
    padding: 30px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    display: none;
  }
  
  .painel.visivel { display: block; animation: fadeIn 0.4s; }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .painel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 2px solid #eee;
    flex-wrap: wrap;
    gap: 10px;
  }
  
  .painel-header h2 {
    color: #333;
    font-size: 1.6rem;
  }
  
  .btn {
    background: #667eea;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 600;
    transition: 0.2s;
    margin-right: 5px;
  }
  
  .btn:hover { background: #5568d3; transform: scale(1.03); }
  .btn.verde { background: #27ae60; }
  .btn.verde:hover { background: #229954; }
  .btn.vermelho { background: #e74c3c; }
  .btn.vermelho:hover { background: #c0392b; }
  .btn.small { padding: 6px 12px; font-size: 0.85rem; }
  
  .form-add {
    display: none;
    background: #f7f8fc;
    border: 2px dashed #667eea;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    gap: 10px;
    flex-wrap: wrap;
  }
  
  .form-add.visivel { display: flex; flex-direction: column; }
  
  .form-add label {
    font-weight: 600;
    color: #444;
    margin-bottom: 5px;
    display: block;
  }
  
  .form-add input[type="text"],
  .form-add input[type="url"] {
    width: 100%;
    padding: 10px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 1rem;
  }
  
  .form-add input:focus { outline: none; border-color: #667eea; }
  
  .lista-pdfs {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 15px;
  }
  
  .pdf-item {
    background: #f7f8fc;
    border-left: 5px solid #e74c3c;
    border-radius: 8px;
    padding: 15px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: 0.2s;
    position: relative;
  }
  
  .pdf-item.fixo {
    border-left-color: #f39c12;
    background: #fffbf0;
  }
  
  .pdf-item:hover {
    background: #eef0f8;
    transform: translateX(5px);
  }
  
  .pdf-item.fixo:hover {
    background: #fff5e0;
  }
  
  .pdf-icon { font-size: 2rem; }
  
  .pdf-info { flex: 1; overflow: hidden; }
  
  .pdf-info a {
    color: #333;
    text-decoration: none;
    font-weight: 600;
    display: block;
    margin-bottom: 3px;
    word-break: break-word;
  }
  
  .pdf-info a:hover { color: #667eea; text-decoration: underline; }
  
  .pdf-info small { color: #888; font-size: 0.8rem; }
  
  .tag-fixo {
    display: inline-block;
    background: #f39c12;
    color: white;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: bold;
    margin-left: 5px;
  }
  
  .pdf-acoes { display: flex; gap: 5px; }
  
  .vazio {
    text-align: center;
    padding: 40px;
    color: #999;
    font-size: 1.1rem;
  }
  
  .vazio .emoji { font-size: 3rem; display: block; margin-bottom: 10px; }
  
  .aviso {
    background: #fff3cd;
    border-left: 4px solid #ffc107;
    padding: 12px;
    border-radius: 6px;
    color: #856404;
    margin-bottom: 15px;
    font-size: 0.9rem;
  }
  
  .aviso-azul {
    background: #d1ecf1;
    border-left: 4px solid #17a2b8;
    padding: 12px;
    border-radius: 6px;
    color: #0c5460;
    margin-bottom: 15px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<div class="container">
   <header>
   <h1>📚 Portal do Aluno</h1>
    <p>Selecione uma turma para acessar os PDFs</p>
  </header>
  
  <div class="turmas-grid" id="turmasGrid"></div>
  
  <div class="painel" id="painel">
    <div class="painel-header">
      <h2 id="tituloPainel"></h2>
      <div>
        <button class="btn verde" onclick="toggleForm()">➕ Adicionar PDF</button>
        <button class="btn" onclick="fecharPainel()">✖ Fechar</button>
      </div>
    </div>
    
    <div class="form-add" id="formAdd">
      <div class="aviso">
        💡 Você pode <b>enviar um arquivo PDF</b> do seu computador ou <b>colar um link</b> de PDF já hospedado online.
      </div>
      <div>
        <label>📝 Nome do material:</label>
        <input type="text" id="nomePdf" placeholder="Ex: Apostila Capítulo 1">
      </div>
      <div>
        <label>📎 Enviar arquivo PDF (opção 1):</label>
        <input type="file" id="arquivoPdf" accept="application/pdf">
      </div>
      <div>
        <label>🔗 Ou cole o link do PDF (opção 2):</label>
        <input type="url" id="linkPdf" placeholder="https://exemplo.com/arquivo.pdf">
      </div>
      <div>
        <button class="btn verde" onclick="adicionarPdf()">✅ Salvar PDF</button>
        <button class="btn" onclick="toggleForm()">Cancelar</button>
      </div>
    </div>
    
    <div id="listaPdfs" class="lista-pdfs"></div>
  </div>
</div>

<script>
  /* ============================================================
     ⭐ PDFs FIXOS (PRÉ-CONFIGURADOS) 
     ============================================================
     Para editar:
     1. Troque o "nome" pelo título que aparecerá para o aluno
     2. Troque a "url" pelo link do PDF (Google Drive, Dropbox, etc.)
     
     ⚠️ DICA GOOGLE DRIVE:
     - Suba o PDF no Drive
     - Clique com botão direito → Compartilhar → "Qualquer pessoa com o link"
     - Copie o link e cole aqui
     ============================================================ */
  const pdfsFixos = {
    turma1: [
      { 
        nome: "📗 Apostila do 1º Ano - Volume 1", 
        url: "https://www.orimi.com/pdf-test.pdf"  // ← TROQUE AQUI
      },
      { 
        nome: "📗 Apostila do 1º Ano - Capítulo 1", 
        url:
"https://drive.google.com/file/d/18RE1n4zEMMifMTOSoF14LqDoGrQWe9kA/view?usp=drivesdk"  // ← TROQUE AQUI
      }
    ],
    turma2: [
      { 
        nome: "📗 Apostila do 2º Ano - Capítulo 1", 
        url: "https://www.orimi.com/pdf-test.pdf"  // ← TROQUE AQUI
      },
      { 
        nome: "📗 Apostila do 3º Ano - Capítulo 2", 
        url: "https://www.orimi.com/pdf-test.pdf"  // ← TROQUE AQUI
      }
    ],
    turma3: [
  { 
        nome: "📗 Apostila do 3º Ano - Capítulo 1", 
        url:
"https://drive.google.com/file/d/18RE1n4zEMMifMTOSoF14LqDoGrQWe9kA/view?usp=drivesdk"  // ← TROQUE AQUI
      },

],  // vazio - professor adiciona manualmente
    turma4: [
     { 
        nome: "📗 Apostila do 1º Ano - Capítulo 1", 
        url:
"https://drive.google.com/file/d/1OMyS5O2v5leh2WT08tQ6htbpjChamFtW/view?usp=sharing"  // ← TROQUE AQUI
      },
    ],
    turma5: [ { 
        nome: "📗 Apostila do 1º Ano - Capítulo 1", 
        url:
"https://drive.google.com/file/d/18RE1n4zEMMifMTOSoF14LqDoGrQWe9kA/view?usp=drivesdk"  // ← TROQUE AQUI
      },
     { 
        nome: "📗 Apostila do 1º Ano - Capítulo 1", 
        url:
"https://docs.google.com/document/d/1nh7XZXRJ56MipZhoq2tHJWY-PijCaTKR/edit?usp=drive_link&ouid=109940531773990116794&rtpof=true&sd=true"  // ← TROQUE AQUI
      }
    ],
  };
  /* ============================================================ */
  
  // ===== CONFIGURAÇÃO DAS 5 TURMAS =====
  const turmas = [
    { id: 'turma1', nome: '1º Ano A', emoji: '1️⃣' },
    { id: 'turma2', nome: '2º Ano A', emoji: '2️⃣' },
    { id: 'turma3', nome: '3º Ano A', emoji: '3️⃣' },
    { id: 'turma4', nome: '4º Ano A', emoji: '4️⃣' },
    { id: 'turma5', nome: '5º Ano A', emoji: '5️⃣' }
  ];
  
  let turmaAtual = null;
  
  // ===== INICIALIZAÇÃO =====
  function init() {
    renderizarTurmas();
    atualizarBadges();
  }
  
  function renderizarTurmas() {
    const grid = document.getElementById('turmasGrid');
    grid.innerHTML = turmas.map(t => `
      <div class="turma-card" id="card-${t.id}" onclick="abrirTurma('${t.id}')">
        <span class="badge" id="badge-${t.id}">0</span>
        <div class="turma-icon">${t.emoji}</div>
        <h3>${t.nome}</h3>
        <div class="info">Clique para acessar os PDFs</div>
      </div>
    `).join('');
  }
  
  function atualizarBadges() {
    turmas.forEach(t => {
      const pdfs = getPdfs(t.id);
      const badge = document.getElementById(`badge-${t.id}`);
      badge.textContent = pdfs.length;
      
      // Destaca em laranja se tem PDF fixo
      if (pdfsFixos[t.id] && pdfsFixos[t.id].length > 0) {
        badge.classList.add('fixo');
      } else {
        badge.classList.remove('fixo');
      }
    });
  }
  
  // ===== LOCALSTORAGE (PDFs adicionados pelo professor) =====
  function getPdfsAdicionados(turmaId) {
    const dados = localStorage.getItem('pdfs_' + turmaId);
    return dados ? JSON.parse(dados) : [];
  }
  
  function salvarPdfsAdicionados(turmaId, pdfs) {
    try {
      localStorage.setItem('pdfs_' + turmaId, JSON.stringify(pdfs));
      return true;
    } catch (e) {
      alert('⚠️ Não foi possível salvar. O arquivo pode ser muito grande. Tente usar um link.');
      return false;
    }
  }
  
  // ===== COMBINA FIXOS + ADICIONADOS =====
  function getPdfs(turmaId) {
    const fixos = (pdfsFixos[turmaId] || []).map(p => ({ ...p, tipo: 'fixo' }));
    const adicionados = getPdfsAdicionados(turmaId).map(p => ({ ...p, tipo: p.tipo || 'link' }));
    return [...fixos, ...adicionados];
  }
  
  // ===== ABRIR TURMA =====
  function abrirTurma(turmaId) {
    turmaAtual = turmaId;
    const turma = turmas.find(t => t.id === turmaId);
    
    document.querySelectorAll('.turma-card').forEach(c => c.classList.remove('ativa'));
    document.getElementById('card-' + turmaId).classList.add('ativa');
    
    document.getElementById('painel').classList.add('visivel');
    document.getElementById('tituloPainel').textContent = `${turma.emoji} ${turma.nome} - PDFs`;
    document.getElementById('formAdd').classList.remove('visivel');
    
    renderizarPdfs();
    
    document.getElementById('painel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  
  function fecharPainel() {
    document.getElementById('painel').classList.remove('visivel');
    document.querySelectorAll('.turma-card').forEach(c => c.classList.remove('ativa'));
    turmaAtual = null;
  }
  
  // ===== RENDERIZAR PDFS =====
  function renderizarPdfs() {
    const lista = document.getElementById('listaPdfs');
    const pdfs = getPdfs(turmaAtual);
    
    if (pdfs.length === 0) {
      lista.innerHTML = `
        <div class="vazio" style="grid-column: 1/-1;">
          <span class="emoji">📭</span>
          Nenhum PDF adicionado ainda.<br>
          <small>Clique em "Adicionar PDF" para começar.</small>
        </div>
      `;
      return;
    }
    
    lista.innerHTML = pdfs.map((pdf, i) => {
      const isFixo = pdf.tipo === 'fixo';
      const indexAdicionado = isFixo ? -1 : i - (pdfsFixos[turmaAtual]?.length || 0);
      
      return `
        <div class="pdf-item ${isFixo ? 'fixo' : ''}">
          <div class="pdf-icon">📄</div>
          <div class="pdf-info">
            <a href="${pdf.url}" target="_blank" rel="noopener">
              ${escapeHtml(pdf.nome)}
              ${isFixo ? '<span class="tag-fixo">FIXO</span>' : ''}
            </a>
            <small>${pdf.tipo === 'upload' ? '📎 Arquivo enviado' : 
                    pdf.tipo === 'fixo' ? '🔒 Fixo pelo professor' : 
                    '🔗 Link externo'}</small>
          </div>
          <div class="pdf-acoes">
            ${!isFixo ? 
              `<button class="btn vermelho small" onclick="removerPdf(${indexAdicionado})" title="Remover">🗑️</button>` :
              `<button class="btn small" style="background:#ccc;cursor:not-allowed" title="PDF fixo - só edita no código">🔒</button>`
            }
          </div>
        </div>
      `;
    }).join('');
  }
  
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
  
  // ===== FORMULÁRIO =====
  function toggleForm() {
    document.getElementById('formAdd').classList.toggle('visivel');
    document.getElementById('nomePdf').value = '';
    document.getElementById('arquivoPdf').value = '';
    document.getElementById('linkPdf').value = '';
  }
  
  function adicionarPdf() {
    const nome = document.getElementById('nomePdf').value.trim();
    const arquivo = document.getElementById('arquivoPdf').files[0];
    const link = document.getElementById('linkPdf').value.trim();
    
    if (!nome) {
      alert('⚠️ Digite um nome para o material.');
      return;
    }
    
    if (!arquivo && !link) {
      alert('⚠️ Envie um arquivo PDF ou cole um link.');
      return;
    }
    
    if (arquivo) {
      if (arquivo.type !== 'application/pdf') {
        alert('⚠️ O arquivo deve ser um PDF.');
        return;
      }
      
      if (arquivo.size > 4 * 1024 * 1024) {
        alert('⚠️ O arquivo é muito grande (máx. 4MB). Use a opção de link externo.');
        return;
      }
      
      const reader = new FileReader();
      reader.onload = function(e) {
        const pdfs = getPdfsAdicionados(turmaAtual);
        pdfs.push({ nome, url: e.target.result, tipo: 'upload' });
        if (salvarPdfsAdicionados(turmaAtual, pdfs)) {
          renderizarPdfs();
          atualizarBadges();
          toggleForm();
        }
      };
      reader.readAsDataURL(arquivo);
    } else {
      const pdfs = getPdfsAdicionados(turmaAtual);
      pdfs.push({ nome, url: link, tipo: 'link' });
      if (salvarPdfsAdicionados(turmaAtual, pdfs)) {
        renderizarPdfs();
        atualizarBadges();
        toggleForm();
      }
    }
  }
  
  function removerPdf(index) {
    if (!confirm('Deseja realmente remover este PDF?')) return;
    const pdfs = getPdfsAdicionados(turmaAtual);
    pdfs.splice(index, 1);
    salvarPdfsAdicionados(turmaAtual, pdfs);
    renderizarPdfs();
    atualizarBadges();
  }
  
  init();
</script>
</body>
</html>
